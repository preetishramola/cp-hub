spring.application.name=cp-hub

# Server (hosts like Render set PORT)
server.port=${PORT:8080}

# Database (set these as environment variables, never commit real values)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/campusrank}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (JWT_SECRET must be at least 32 characters)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS (comma-separated list of allowed frontend origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://cp-hub-frontend.vercel.app}
